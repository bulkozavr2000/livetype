<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>LiveType editor loading</title>
<!-- a real ProseMirror editor (basic schema + example setup: menu, keymaps, input rules such as
     smart quotes, "..." -> "…", "--" -> "—", "- " -> list), loaded from esm.sh with pinned
     versions; every package is external, so there is exactly one copy of each -->
<script type="importmap">
{
  "imports": {
    "prosemirror-model": "https://esm.sh/*prosemirror-model@1.25.12",
    "prosemirror-state": "https://esm.sh/*prosemirror-state@1.4.4",
    "prosemirror-view": "https://esm.sh/*prosemirror-view@1.42.9",
    "prosemirror-transform": "https://esm.sh/*prosemirror-transform@1.12.5",
    "prosemirror-commands": "https://esm.sh/*prosemirror-commands@1.7.2",
    "prosemirror-dropcursor": "https://esm.sh/*prosemirror-dropcursor@1.8.4",
    "prosemirror-gapcursor": "https://esm.sh/*prosemirror-gapcursor@1.4.1",
    "prosemirror-history": "https://esm.sh/*prosemirror-history@1.5.1",
    "prosemirror-inputrules": "https://esm.sh/*prosemirror-inputrules@1.5.1",
    "prosemirror-keymap": "https://esm.sh/*prosemirror-keymap@1.2.3",
    "prosemirror-menu": "https://esm.sh/*prosemirror-menu@1.3.2",
    "prosemirror-schema-basic": "https://esm.sh/*prosemirror-schema-basic@1.2.5",
    "prosemirror-schema-list": "https://esm.sh/*prosemirror-schema-list@1.6.0",
    "prosemirror-example-setup": "https://esm.sh/*prosemirror-example-setup@1.2.3",
    "orderedmap": "https://esm.sh/*orderedmap@2.1.1",
    "rope-sequence": "https://esm.sh/*rope-sequence@1.3.4",
    "w3c-keyname": "https://esm.sh/*w3c-keyname@2.2.8",
    "crelt": "https://esm.sh/*crelt@1.0.7"
  }
}
</script>
<link rel="stylesheet" href="https://esm.sh/prosemirror-view@1.42.9/style/prosemirror.css">
<link rel="stylesheet" href="https://esm.sh/prosemirror-menu@1.3.2/style/menu.css">
<link rel="stylesheet" href="https://esm.sh/prosemirror-example-setup@1.2.3/style/style.css">
<style>
  html, body { margin: 0; height: 100%; font: 16px "Segoe UI", sans-serif; }
  #editor { height: 100%; }
  .ProseMirror { padding: 8px 12px; outline: 0; min-height: 200px; }
  .ProseMirror p { margin: 0; }
</style>
</head>
<body>
<div id="editor"></div>
<script type="module">
  import { EditorState, TextSelection } from "prosemirror-state";
  import { EditorView } from "prosemirror-view";
  import { Schema } from "prosemirror-model";
  import { schema as basic } from "prosemirror-schema-basic";
  import { addListNodes } from "prosemirror-schema-list";
  import { exampleSetup } from "prosemirror-example-setup";

  try {
    const p = new URLSearchParams(location.search);
    const schema = new Schema({ nodes: addListNodes(basic.spec.nodes, "paragraph block*", "block"),
                                marks: basic.spec.marks });
    const text = p.get("text") || "";
    const lines = text.split("\n");  // one paragraph per line
    const doc = schema.node("doc", null, lines.map((l) => schema.node("paragraph", null, l ? [schema.text(l)] : [])));
    let state = EditorState.create({ doc, plugins: exampleSetup({ schema }) });
    const c = parseInt(p.get("caret") || "-1", 10);
    const at = c >= 0 ? Math.min(c, text.length) : text.length;
    // a paragraph break is 2 positions (close + open) but 1 character ("\n") of the text
    const pos = 1 + at + (text.slice(0, at).split("\n").length - 1);
    state = state.apply(state.tr.setSelection(TextSelection.create(state.doc, pos)));
    const view = new EditorView(document.getElementById("editor"), { state });
    window.view = view;
    view.focus();
    document.title = p.get("title") || "LiveType Edge test";
  } catch (e) {
    document.title = "LiveType editor failed: " + e;
  }
</script>
</body>
</html>
